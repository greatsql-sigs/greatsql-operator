---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-database-greatsql-cn-v1alpha1-groupreplicationcluster
  failurePolicy: Fail
  name: mgroupreplicationcluster-v1alpha1.kb.io
  rules:
  - apiGroups:
    - database.greatsql.cn
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - groupreplicationclusters
  sideEffects: None
- admissionReviewVersions:
  - v1
