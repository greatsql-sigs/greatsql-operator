  failurePolicy: Fail
  name: mstandalone-v1alpha1.kb.io
  rules:
  - apiGroups:
    - database.greatsql.cn
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - standalones
  sideEffects: None
