# This rule is not used by the project greatsql-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to database.greatsql.cn resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: greatsql-operator
    app.kubernetes.io/managed-by: kustomize
  name: schedulingbackup-viewer-role
rules:
- apiGroups:
  - database.greatsql.cn
  resources:
  - schedulingbackups
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - database.greatsql.cn
  resources:
  - schedulingbackups/status
  verbs:
  - get
