# This rule is not used by the project greatsql-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over database.greatsql.cn.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: greatsql-operator
    app.kubernetes.io/managed-by: kustomize
  name: schedulingbackup-admin-role
rules:
- apiGroups:
  - database.greatsql.cn
  resources:
  - schedulingbackups
  verbs:
  - '*'
- apiGroups:
  - database.greatsql.cn
  resources:
  - schedulingbackups/status
  verbs:
  - get
