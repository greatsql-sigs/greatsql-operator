# permissions for end users to view singles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: Standalone-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: greatsql
    app.kubernetes.io/part-of: greatsql
    app.kubernetes.io/managed-by: kustomize
  name: Standalone-viewer-role
rules:
- apiGroups:
  - database.greatsql.cn
  resources:
  - singles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - database.greatsql.cn
  resources:
  - singles/status
  verbs:
  - get
