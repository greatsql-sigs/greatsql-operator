name: Publish Helm Charts to GitHub Pages

on:
  release:
    # 仅在正式发布时触发
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.3

      - name: Package Helm charts
        run: |
          mkdir -p output
          
          if [ -f helm/index.html ]; then
            cp helm/index.html output/index.html
          fi
          
          for chart in helm/*/Chart.yaml; do
            chart_dir=$(dirname "$chart")
            helm package "$chart_dir" -d output
          done

          helm repo index output --url https://greatsql-sigs.github.io/greatsql-operator

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
