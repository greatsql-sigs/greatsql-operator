name: GreatSQL Operator Build & Release

permissions:
  contents: write
  actions: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Build branch'
        required: true
        default: 'main'
        type: string
      version:
        description: 'Version'
        required: true
        default: 'alpha'
        type: string
      release:
        description: 'Whether to publish a release'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: go.mod

      - name: Install Go dependencies
        run: go mod download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag registry.cn-beijing.aliyuncs.com/greatsql/greatsql-operator:${{ inputs.version }} \
            .
          echo "Docker image built & pushed with tag: ${{ inputs.version }}"

      - name: Set version output
        id: setversion
        run: echo "::set-output name=version::${{ inputs.version }}"

    outputs:
      version: ${{ steps.setversion.outputs.version }}


  release:
    name: Create Tag and Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.release == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create & Push Git Tag
        run: |
          VERSION='${{ needs.build.outputs.version }}'
          echo "Creating tag $VERSION..."
          git config user.name "gagraler"
          git tag -d "$VERSION" || true
          git push origin :refs/tags/$VERSION || true

          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          release_name: ${{ needs.build.outputs.version }}
          prerelease: false
          body: |
            请点击查看 [更新日志](https://github.com/greatsql-sigs/greatsql-operator/blob/main/CHANGELOG.md).
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
