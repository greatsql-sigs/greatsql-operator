{{- if .Values.rbac.enable }}
# permissions for end users to view GroupReplicationClusters.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: GroupReplicationCluster-viewer-role
rules:
- apiGroups:
  - database.greatsql.cn
  resources:
  - GroupReplicationClusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - database.greatsql.cn
  resources:
  - GroupReplicationClusters/status
  verbs:
  - get
{{- end -}}
