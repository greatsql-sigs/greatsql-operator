{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: greatsql-controller-manager-rolebinding
  namespace: greatsql-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: greatsql-role
subjects:
- kind: ServiceAccount
  name: greatsql-controller-manager-sa
  namespace: greatsql-system{{- end -}}
